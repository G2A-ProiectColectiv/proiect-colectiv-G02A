name: Backend CI (Spring Boot)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rental_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/rental_platform_test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/rental_platform_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Spring Boot Tests
        run: |
          cd backend
          ./gradlew test

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build jar
        run: |
          cd backend
          ./gradlew bootJar -x test

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: backend-libs
          path: backend/build/libs
          retention-days: 1

  dependency-scan:
    runs-on: ubuntu-latest
    needs: build-backend
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: backend-libs
          path: build/libs

      - name: Generate Trivy report
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            rootfs build/libs --format json --output trivy-report.json \
            --no-progress --timeout 15m

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail on CRITICAL/HIGH vulnerabilities
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            rootfs build/libs --exit-code 1 --severity CRITICAL,HIGH \
            --no-progress --timeout 15m

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Checkstyle
        run: |
          cd backend
          ./gradlew checkstyleMain checkstyleTest

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: backend/build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: ignore
