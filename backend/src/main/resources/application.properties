spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=rental-platform
spring.profiles.active=dev

# conexiunea la baza de date, din .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# schema o creeaza doar Flyway; Hibernate doar o valideaza
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.placeholders.adminEmail=${ADMIN_EMAIL}
spring.flyway.placeholders.adminPasswordHash=${ADMIN_PASSWORD_HASH}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=24h

app.storage.root=../uploads
app.storage.max-size=5242880
app.storage.allowed-types=jpg,jpeg,png,webp
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB

app.location.allowed-hosts=maps.app.goo.gl,goo.gl,google.com,www.google.com,maps.google.com,google.ro,www.google.ro,maps.google.ro
app.location.max-redirects=5
app.location.timeout=5s
app.location.rate-limit-per-minute=20

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# true = trimite emailuri reale prin SMTP; false = doar le scrie in log (LoggingEmailService)
app.mail.enabled=${MAIL_ENABLED:false}
# adresa expeditorului (la Gmail trebuie sa fie contul autentificat)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# originile frontendului acceptate de CORS (separate prin virgula); implicit serverul de dezvoltare
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
